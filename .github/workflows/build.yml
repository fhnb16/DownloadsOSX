name: Build

# Builds Downloads.exe and the setup on every branch push and pull request and uploads them as a workflow artifact
# (Actions → run → Artifacts). master and tags are built by release.yml, which also publishes releases.

on:
  push:
    branches-ignore: [master]
    paths-ignore: ['**.md', 'legacy/**', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'legacy/**', '.gitignore']
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/DownloadsOSX/DownloadsOSX.csproj -XPath '//Version').Node.InnerText
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src/DownloadsOSX/DownloadsOSX.csproj -restore -p:Configuration=Release -p:ContinuousIntegrationBuild=true -v:m

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Signs only when the SIGN_PFX_BASE64 secret is set (not for pull requests from forks); otherwise warns.
      - name: Sign and build installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/DownloadsOSX/bin/Release/net48/Downloads.exe dist/
          ./tools/sign.ps1 dist/Downloads.exe
          ./tools/build-installer.ps1 -Exe dist/Downloads.exe -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: Downloads-${{ steps.v.outputs.version }}-${{ steps.v.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
