name: Release

# Builds Downloads.exe and DownloadsOSX-Setup.exe (Authenticode-signed when the SIGN_PFX_BASE64 secret is set),
# generates update.json and publishes a GitHub release when:
#  - master is pushed with a new <Version> in DownloadsOSX.csproj (the tag v<Version> is created by the release), or
#  - a tag like v1.2.0 is pushed by hand.
# Installed apps pick it up through https://github.com/<owner>/<repo>/releases/latest/download/update.json.
# Versions with a suffix (1.2.0-rc1) become pre-releases, which "latest" ignores — handy for testing.
# Pushes to master that keep an already released version only build and upload an artifact.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', 'legacy/**', '.gitignore']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (manual runs only upload an artifact)
        default: 0.0.0-dev

permissions:
  contents: write

# Run releases one at a time so a commit and its tag pushed together can't both create the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $v = (Select-Xml -Path src/DownloadsOSX/DownloadsOSX.csproj -XPath '//Version').Node.InnerText
            # Each version is released once: an existing tag means this push didn't bump it (or the tag run releases it).
            if (git tag -l "v$v") {
              "::notice::v$v already exists, building without publishing. Bump <Version> to release."
              "skip=true" >> $env:GITHUB_OUTPUT
            }
          } else {
            $v = '${{ inputs.version }}'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild src/DownloadsOSX/DownloadsOSX.csproj -restore -p:Configuration=Release -p:Version=${{ steps.v.outputs.version }} -p:ContinuousIntegrationBuild=true -v:m

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Signs only when the SIGN_PFX_BASE64 secret is set (see tools/sign.ps1); otherwise warns and continues unsigned.
      - name: Sign and build installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/DownloadsOSX/bin/Release/net48/Downloads.exe dist/
          ./tools/sign.ps1 dist/Downloads.exe
          ./tools/build-installer.ps1 -Exe dist/Downloads.exe -Version '${{ steps.v.outputs.version }}' -OutDir dist

      # After signing: update.json carries the SHA-256 of the signed exe.
      - name: Package
        shell: pwsh
        run: |
          # Release notes: the annotated tag message, else the last commit message.
          git fetch --tags --force | Out-Null
          $notes = if ($env:GITHUB_REF_TYPE -eq 'tag') { git tag -l --format='%(contents:body)' $env:GITHUB_REF_NAME } else { $null }
          if (-not "$notes".Trim()) { $notes = git log -1 --format=%B }
          Set-Content dist/notes.md $notes

          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/Downloads.exe"
          ./tools/make-manifest.ps1 -Exe dist/Downloads.exe -Version '${{ steps.v.outputs.version }}' -Url $url -NotesFile dist/notes.md -Out dist/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: Downloads-${{ steps.v.outputs.version }}
          path: dist/

      - name: Publish release
        if: github.event_name == 'push' && steps.v.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          # --target creates the tag on this commit when it doesn't exist yet (master pushes).
          $ghArgs = @($tag, 'dist/Downloads.exe', 'dist/DownloadsOSX-Setup.exe', 'dist/update.json', '--title', "Downloads $tag", '--notes-file', 'dist/notes.md', '--target', $env:GITHUB_SHA)
          if ('${{ steps.v.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
